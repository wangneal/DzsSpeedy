name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust targets
        run: rustup target add i686-pc-windows-msvc

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install frontend dependencies
        run: npm ci

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid release version: $version"
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Align build version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:RELEASE_VERSION

          $tauriPath = 'src-tauri/tauri.conf.json'
          $tauri = Get-Content $tauriPath -Raw | ConvertFrom-Json
          $tauri.version = $version
          $tauri | ConvertTo-Json -Depth 100 | Set-Content $tauriPath -Encoding utf8

          $packagePath = 'package.json'
          $package = Get-Content $packagePath -Raw | ConvertFrom-Json
          $package.version = $version
          $package | ConvertTo-Json -Depth 100 | Set-Content $packagePath -Encoding utf8

          $cargoPath = 'src-tauri/Cargo.toml'
          $cargo = Get-Content $cargoPath -Raw
          $cargo = [regex]::Replace($cargo, '(?m)^version = "[^"]+"', ('version = "' + $version + '"'), 1)
          Set-Content $cargoPath $cargo -Encoding utf8

      - name: Install osslsigncode
        shell: pwsh
        run: choco install osslsigncode -y --no-progress

      - name: Build (unbundled, produces DLLs/EXEs)
        run: npx tauri build --no-bundle

      - name: Sign speedpatch DLLs
        shell: pwsh
        env:
          SIGN_PFX_B64: ${{ secrets.DZSSPEED_SIGN_PFX }}
          SIGN_PASS: ${{ secrets.DZSSPEED_SIGN_PASS }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SIGN_PFX_B64 -or -not $env:SIGN_PASS) {
            throw 'Missing DZSSPEED_SIGN_PFX / DZSSPEED_SIGN_PASS secrets'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'dzsspeedy-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_B64))
          # Sign both locations: target/release (portable zip) and binaries
          # (the MSI bundles binaries/*).
          $targets = @()
          foreach ($dll in 'speedpatch32.dll', 'speedpatch64.dll') {
            $targets += "src-tauri/target/release/$dll"
            $targets += "src-tauri/binaries/$dll"
          }
          foreach ($src in $targets) {
            if (-not (Test-Path $src)) { throw "missing built DLL: $src" }
            $out = "$src.signed"
            & osslsigncode sign -pkcs12 $pfx -pass $env:SIGN_PASS -h sha256 -in $src -out $out
            if ($LASTEXITCODE -ne 0) { throw "osslsigncode failed for $src" }
            Move-Item $out $src -Force
            $st = (Get-AuthenticodeSignature $src)
            # The CI runner does not trust our root yet, so the status here is
            # UnknownError (chain incomplete) even though the signature block is
            # valid; the MSI installs the root on the user machine. Fail only if
            # the signature block is actually absent.
            if ($st.Status -eq 'NotSigned' -or -not $st.SignerCertificate) {
              throw "signature block missing after signing: $src ($($st.Status))"
            }
            "signed $src -> $($st.Status)"
          }

      - name: Build MSI (reuses pre-signed DLLs; no source change so no rebuild)
        run: npx tauri build --bundles msi

      - name: Package portable release
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $output = "src-tauri/target/release/DzsSpeedy-$env:RELEASE_VERSION-portable.zip"
          Compress-Archive -Path @(
            'src-tauri/target/release/DzsSpeedy.exe',
            'src-tauri/target/release/bridge32.exe',
            'src-tauri/target/release/bridge64.exe',
            'src-tauri/target/release/speedpatch32.dll',
            'src-tauri/target/release/speedpatch64.dll'
          ) -DestinationPath $output -Force

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: DzsSpeedy-${{ steps.version.outputs.version }}-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: DzsSpeedy-${{ steps.version.outputs.version }}-portable
          path: src-tauri/target/release/DzsSpeedy-${{ steps.version.outputs.version }}-portable.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DzsSpeedy v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/DzsSpeedy-${{ steps.version.outputs.version }}-portable.zip
